name: Build SPO

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # WDK 11 (26100) — installs VS extension for WindowsKernelModeDriver10.0 toolset
      - name: Install WDK
        shell: powershell
        run: |
          choco install windowsdriverkit11 --yes --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + `
                      [System.Environment]::GetEnvironmentVariable("Path","User")

      # ── usermode: spo.exe + loader.exe via CMake ──────────────────────────────
      - name: Configure CMake
        run: |
          cmake -S build -B build/out -G "Visual Studio 17 2022" -A x64 `
                -DCMAKE_BUILD_TYPE=Release

      - name: Build usermode
        run: cmake --build build/out --config Release --parallel

      # ── kernel driver: spo_drv.sys via MSBuild + WDK ─────────────────────
      - name: Build kernel driver
        run: |
          msbuild build\kernel\spo_drv.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:OutDir=${{ github.workspace }}\build\out\bin\Release\ `
            /m /nologo /v:minimal

      # ── zip artifacts ───────────────────────────────────────────────────────
      - name: Package release
        shell: powershell
        run: |
          $out = "build\out\bin\Release"
          Compress-Archive -Path "$out\spo.exe","$out\loader.exe","$out\spo_drv.sys" `
            -DestinationPath "spo-release-x64.zip" -Force

      # ── upload artifact (always) ──────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spo-release-x64
          path: spo-release-x64.zip
          retention-days: 30

      # ── publish GitHub Release ────────────────────────────────────────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "SPO build ${{ github.run_number }}"
          body: |
            Automated release from branch `${{ github.ref_name }}` — commit `${{ github.sha }}`

            **Contents:**
            - `spo.exe` — usermode spoofer (registry, NIC, EDID, GPU)
            - `loader.exe` — kernel driver loader via iqvw64e.sys primitive
            - `spo_drv.sys` — kernel filter driver (disk serial + SMBIOS UUID)

            **Usage:** see README
          files: spo-release-x64.zip
          draft: false
          prerelease: false
